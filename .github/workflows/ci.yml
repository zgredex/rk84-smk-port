name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Synthetic/unit: runs anywhere, needs only the pinned SMK keycode
  # definitions (keymap_fixture requires RK84_SMK_TREE).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout pinned SMK definitions
        run: |
          git clone https://github.com/carlossless/smk.git smk-upstream
          git -C smk-upstream checkout 08f4d0253389551b9ae9aad2464e2d7cacaf662e

      - name: Apply RK84 patches (harness needs patched report.c)
        run: |
          SMK_DIR=$PWD/smk-upstream bash $PWD/tools/apply-to-smk.sh

      - name: Run synthetic test suite
        env:
          RK84_SMK_TREE: ${{ github.workspace }}/smk-upstream
        run: |
          python3 -m unittest -v \
            tests.test_hexlib \
            tests.test_hex_bounds \
            tests.test_matrix_model \
            tests.test_report_model \
            tests.test_rgb_model \
            tests.test_usb_full_acceptance \
            tests.test_c_harness \
            2>&1 | tee test.log
          ! grep -qE '^FAILED|errors=' test.log || exit 1

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rk84-recovery
            setup: "-Drk84_stage=recovery"
            dir: build-rk84-recovery
          - name: rk84-matrix
            setup: "-Drk84_stage=matrix"
            dir: build-rk84-matrix
          - name: rk84-usb
            setup: "-Drk84_stage=usb"
            dir: build-rk84-usb
          - name: rk84-rgb
            setup: "-Drk84_stage=rgb"
            dir: build-rk84-rgb
          - name: rk84-dual
            setup: "-Drk84_stage=matrix -Drk84_dual_reports=true"
            dir: build-rk84-dual
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout pinned SMK
        run: |
          git clone https://github.com/carlossless/smk.git smk
          cd smk
          git checkout 08f4d0253389551b9ae9aad2464e2d7cacaf662e

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc meson ninja-build python3

      - name: Apply RK84 patches
        run: |
          SMK_DIR=$PWD/smk bash $PWD/tools/apply-to-smk.sh

      - name: Build (${{ matrix.name }})
        run: |
          cd smk
          meson setup ${{ matrix.dir }} --buildtype=release ${{ matrix.setup }}
          ninja -C ${{ matrix.dir }} royalkludge-rk84_default_smk.hex
          ninja -C ${{ matrix.dir }} royalkludge-rk84_default_smk.ihx

      - name: Verify compiled delay ABI (${{ matrix.name }})
        # delay.asm exists only after a real build; run on every RK84
        # matrix entry (asm content is identical across stages, but the
        # regression must not silently skip).
        env:
          RK84_SMK_TREE: ${{ github.workspace }}/smk
        run: |
          python3 -m unittest -v tests.test_delay_abi 2>&1 | tee delay-abi.log
          ! grep -q 'skipped=' delay-abi.log || {
            echo "delay ABI test skipped (no compiled delay.asm) — FAIL" >&2
            exit 1
          }

      - name: XRAM budget gate (${{ matrix.name }})
        # Static XDATA must stay under 3 KiB: a future dynamic-keymap
        # configurator adds ~384 B on top of today's 1,207 B. Fail CI
        # on silent XRAM drift before it breaks the configurator.
        run: |
          python3 $PWD/tools/check-xram-budget.py \
            smk/${{ matrix.dir }}/royalkludge-rk84_default_smk.mem \
            --limit 3072

      - name: Validate HEX (bounds + checksum, cap 0xBC00)
        run: |
          python3 $PWD/tools/check-hex-bounds.py \
            smk/${{ matrix.dir }}/royalkludge-rk84_default_smk.hex \
            --limit 0xBC00

      - name: Validate HEX (hard cap 0xEC00)
        run: |
          python3 $PWD/tools/check-hex-bounds.py \
            smk/${{ matrix.dir }}/royalkludge-rk84_default_smk.hex \
            --limit 0xEC00

      - name: Verify USB descriptors
        run: |
          python3 $PWD/tools/check-usb-descriptors.py \
            smk/${{ matrix.dir }}/royalkludge-rk84_default_smk.hex

      - name: Build manifest
        run: |
          python3 $PWD/tools/make-manifest.py \
            smk/${{ matrix.dir }}/royalkludge-rk84_default_smk.hex \
            smk/${{ matrix.dir }}/royalkludge-rk84_default_smk.ihx \
            --build-dir smk/${{ matrix.dir }} \
            --out smk/${{ matrix.dir }}/MANIFEST.txt
          cat smk/${{ matrix.dir }}/MANIFEST.txt

      - name: Recovery invariant (${{ matrix.name }})
        if: matrix.name == 'rk84-recovery'
        run: |
          python3 $PWD/tools/check-recovery-no-pwm.py \
            smk/${{ matrix.dir }}/royalkludge-rk84_default_smk.hex

      - name: Upload firmware (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: UNTESTED-rk84-${{ matrix.name }}-${{ github.sha }}
          path: |
            smk/${{ matrix.dir }}/royalkludge-rk84_default_smk.hex
            smk/${{ matrix.dir }}/royalkludge-rk84_default_smk.ihx
            smk/${{ matrix.dir }}/MANIFEST.txt

  # Integration: recovery + matrix artifact tests with env vars; the
  # required artifact tests FAIL when env vars are absent.
  integration:
    runs-on: ubuntu-latest
    needs: build
    env:
      RK84_RECOVERY_HEX: ${{ github.workspace }}/smk/build-rk84-recovery/royalkludge-rk84_default_smk.hex
      RK84_RECOVERY_IHX: ${{ github.workspace }}/smk/build-rk84-recovery/royalkludge-rk84_default_smk.ihx
      RK84_MATRIX_HEX: ${{ github.workspace }}/smk/build-rk84-matrix/royalkludge-rk84_default_smk.hex
      RK84_MATRIX_IHX: ${{ github.workspace }}/smk/build-rk84-matrix/royalkludge-rk84_default_smk.ihx
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout pinned SMK
        run: |
          git clone https://github.com/carlossless/smk.git smk
          cd smk
          git checkout 08f4d0253389551b9ae9aad2464e2d7cacaf662e

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc meson ninja-build python3

      - name: Apply RK84 patches
        run: |
          SMK_DIR=$PWD/smk bash $PWD/tools/apply-to-smk.sh

      - name: Build recovery + matrix (HEX and IHX)
        run: |
          cd smk
          meson setup build-rk84-recovery --buildtype=release -Drk84_stage=recovery
          ninja -C build-rk84-recovery royalkludge-rk84_default_smk.hex
          ninja -C build-rk84-recovery royalkludge-rk84_default_smk.ihx
          meson setup build-rk84-matrix --buildtype=release -Drk84_stage=matrix
          ninja -C build-rk84-matrix royalkludge-rk84_default_smk.hex
          ninja -C build-rk84-matrix royalkludge-rk84_default_smk.ihx

      - name: Run artifact integration tests (fail on skip/absence)
        run: |
          python3 -m unittest -v \
            tests.test_no_pwm \
            tests.test_usb_descriptors \
            2>&1 | tee int.log
          ! grep -q 'skipped=' int.log || { echo "integration tests skipped — FAIL" >&2; exit 1; }

  # Reproducibility: two complete clean builds, byte-identical.
  reproducibility:
    runs-on: ubuntu-latest
    needs: build
    env:
      RK84_SMK_TREE: ${{ github.workspace }}/smk
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout pinned SMK
        run: |
          git clone https://github.com/carlossless/smk.git smk
          cd smk
          git checkout 08f4d0253389551b9ae9aad2464e2d7cacaf662e

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc meson ninja-build python3

      - name: Apply RK84 patches
        run: |
          SMK_DIR=$PWD/smk bash $PWD/tools/apply-to-smk.sh

      - name: Two clean builds byte-identical + manifest
        run: |
          python3 -m unittest -v \
            tests.test_reproducibility \
            2>&1 | tee repro.log
          ! grep -q 'skipped=' repro.log || { echo "reproducibility tests skipped — FAIL" >&2; exit 1; }

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Checkout pinned SMK
        run: |
          git clone https://github.com/carlossless/smk.git smk
          cd smk
          git checkout 08f4d0253389551b9ae9aad2464e2d7cacaf662e

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc meson ninja-build python3

      - name: Apply RK84 patches
        run: |
          SMK_DIR=$PWD/smk bash $PWD/tools/apply-to-smk.sh

      - name: Build upstream boards (generic-path regression)
        run: |
          cd smk
          meson setup build-compat --buildtype=release
          ninja -C build-compat \
            example_default_smk.hex \
            eyooso-z11_default_smk.hex
          # NOTE: nuphy-air60 does not compile on SDCC 4.6.0 even on
          # pristine upstream (error 110 in its own kb.c + the
          # required sinowealth-kb-tool). Excluded until upstream
          # toolchain requirements are satisfied.

      - name: Validate compat HEXes
        run: |
          python3 $PWD/tools/check-hex-bounds.py \
            smk/build-compat/example_default_smk.hex --limit 0xEC00
          python3 $PWD/tools/check-hex-bounds.py \
            smk/build-compat/eyooso-z11_default_smk.hex --limit 0xEC00
